# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Fabric Properties - https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.chestmemory
archives_base_name=chestmemory

# Dependencies
fabric_api_version=0.155.2+26.2

# NOTE: do not set org.gradle.java.home here — an absolute path breaks the build for
# everyone else, including CI. Point JAVA_HOME at a JDK 25 instead; the toolchain
# block in build.gradle handles the rest.

# Clan hub baked into the jar, so members only ever type a session code.
# Without these the build produces a public jar and the URL / token fields
# reappear in the clan screen — which is exactly the bug this prevents.
# Keep the token OUT of git: put it in gradle.local.properties instead.
clan_hub_url=https://chestmemory-clan.duckdns.org
