plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	// Local Jade jar fallback (downloaded for compile)
	flatDir {
		dirs 'libs'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"chestmemory" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional Jade compile-only (plugin loads only when Jade is installed)
	compileOnly "maven.modrinth:jade:26.2.9+fabric"

	// Optional Litematica + MaLiLib (build-gather mode; runtime only if installed)
	compileOnly files("libs/litematica-26.2.jar")
	compileOnly files("libs/malilib-26.2.jar")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	// Bake the clan hub into the jar so members only type a session code.
	// Set clan_hub_url / clan_hub_token in gradle.properties, or pass
	//   ./gradlew build -Pclan_hub_url=https://my.hub -Pclan_hub_token=secret
	// Left empty in a public build: the mod then shows the manual fields as before.
	def hubUrl = project.findProperty("clan_hub_url") ?: ""
	def hubToken = project.findProperty("clan_hub_token") ?: ""
	inputs.property "clanHubUrl", hubUrl
	inputs.property "clanHubToken", hubToken
	filesMatching("assets/chestmemory/clan_hub.json") {
		expand "clan_hub_url": hubUrl, "clan_hub_token": hubToken
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	// Auto-download JDK 25 if the current JVM is older
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def projectName = project.base.archivesName.get()
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
